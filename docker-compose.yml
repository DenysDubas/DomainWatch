services:
  mysql:
    image: mysql:8.0
    container_name: dm_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-domain_monitor}
      MYSQL_USER: ${DB_USERNAME:-dmuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dmpassword}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: dm_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
      - vendor_cache:/var/www/html/vendor
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-domain_monitor}
      DB_USERNAME: ${DB_USERNAME:-dmuser}
      DB_PASSWORD: ${DB_PASSWORD:-dmpassword}
      QUEUE_CONNECTION: database
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.com}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}

  nginx:
    image: nginx:alpine
    container_name: dm_nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: dm_scheduler
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
      - vendor_cache:/var/www/html/vendor
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-domain_monitor}
      DB_USERNAME: ${DB_USERNAME:-dmuser}
      DB_PASSWORD: ${DB_PASSWORD:-dmpassword}
      QUEUE_CONNECTION: database
    command: ["php", "artisan", "schedule:work"]

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: dm_queue
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
      - vendor_cache:/var/www/html/vendor
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-domain_monitor}
      DB_USERNAME: ${DB_USERNAME:-dmuser}
      DB_PASSWORD: ${DB_PASSWORD:-dmpassword}
      QUEUE_CONNECTION: database
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3"]

volumes:
  mysql_data:
  vendor_cache:
